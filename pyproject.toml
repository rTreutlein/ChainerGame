[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stationops"
version = "0.1.0"
description = "BaseRateTriage-v0 probabilistic maintenance benchmark"
requires-python = ">=3.11"

[project.scripts]
stationops = "stationops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

